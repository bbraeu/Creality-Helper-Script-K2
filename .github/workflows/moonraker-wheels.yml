name: Moonraker check & wheels (K2)

# Weekly check whether upstream Moonraker can (still) be updated on the K2,
# and prebuilt Python wheels for it.
#
# check: - Python: Moonraker's requires-python must accept the K2's Entware
#          Python (3.11). If not, an issue warns not to update Moonraker on the
#          printer - the update would install code its Python cannot run.
#        - Wheels: the release tag is a hash of moonraker-requirements.txt. If
#          no release exists for the current requirements, the wheels are rebuilt.
# build: builds the wheels in an ARMv7 container with the same Entware Python
#        3.11 toolchain as the printer and publishes "moonraker-wheels-<hash>".
#        The helper's updatable-Moonraker installer downloads them, so nothing
#        is compiled on the printer (488 MB RAM: builds get OOM-killed there).

on:
  schedule:
    - cron: "0 4 * * 1"   # weekly, Monday 04:00 UTC
  workflow_dispatch:
    inputs:
      moonraker_ref:
        description: Moonraker git ref (branch, tag or commit)
        default: master
      force_build:
        description: Build wheels even if the requirements did not change
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

env:
  K2_PYTHON: "3.11"

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
      ref: ${{ steps.check.outputs.ref }}
      req_hash: ${{ steps.check.outputs.req_hash }}
    steps:
      - name: Check upstream Moonraker
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.moonraker_ref || 'master' }}
          FORCE: ${{ inputs.force_build || false }}
        run: |
          set -e
          commit=$(gh api "repos/Arksine/moonraker/commits/$REF" --jq .sha)
          short=${commit:0:7}
          gh api "repos/Arksine/moonraker/contents/scripts/moonraker-requirements.txt?ref=$commit" \
            -H "Accept: application/vnd.github.raw" > requirements.txt
          gh api "repos/Arksine/moonraker/contents/pyproject.toml?ref=$commit" \
            -H "Accept: application/vnd.github.raw" > pyproject.toml
          req_hash=$(sha256sum requirements.txt | cut -c1-12)
          requires=$(sed -n 's/^requires-python *= *"\(.*\)"/\1/p' pyproject.toml | head -1)

          # Does Moonraker accept the K2's Python?
          python3 -m pip install -q --user packaging > /dev/null 2>&1 || true
          python_ok=$(REQ="${requires:->=0}" python3 -c 'import os; from packaging.specifiers import SpecifierSet; print("yes" if os.environ["K2_PYTHON"] in SpecifierSet(os.environ["REQ"]) else "no")')

          tag="moonraker-wheels-$req_hash"
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            have_wheels=yes
          else
            have_wheels=no
          fi
          build=no
          { [ "$have_wheels" = no ] || [ "$FORCE" = true ]; } && [ "$python_ok" = yes ] && build=yes

          {
            echo "### Moonraker $short"
            echo ""
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Latest commit | [\`$short\`](https://github.com/Arksine/moonraker/commit/$commit) |"
            echo "| requires-python | \`$requires\` |"
            echo "| Runs on the K2's Python $K2_PYTHON | $python_ok |"
            echo "| Requirements hash | \`$req_hash\` |"
            echo "| Prebuilt wheels (\`$tag\`) | $have_wheels |"
            echo "| Build wheels now | $build |"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "ref=$commit" >> "$GITHUB_OUTPUT"
          echo "req_hash=$req_hash" >> "$GITHUB_OUTPUT"

          if [ "$python_ok" != yes ]; then
            title="Moonraker $short needs Python $requires - do not update Moonraker on the K2"
            if ! gh issue list -R "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number --jq '.[0].number' | grep -q .; then
              gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --body "Upstream Moonraker ($commit) declares \`requires-python = \"$requires\"\`, but the K2's Entware Python is $K2_PYTHON. Updating Moonraker from Fluidd/Mainsail would install code that cannot run. Pin the helper / wait until Entware ships a newer Python."
            fi
            echo "::error::Moonraker $short requires Python $requires; the K2 has $K2_PYTHON"
            exit 1
          fi

  build:
    needs: check
    if: needs.check.outputs.build == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm

      - name: Build wheels in an ARMv7 container
        run: |
          mkdir -p out
          docker run --rm --platform linux/arm/v7 \
            -v "$PWD:/work" \
            arm32v7/debian:bookworm-slim \
            /bin/sh /work/files/moonraker/build-wheels.sh /work/out "${{ needs.check.outputs.ref }}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          commit="${{ needs.check.outputs.ref }}"
          tag="moonraker-wheels-${{ needs.check.outputs.req_hash }}"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" out/moonraker-wheels-k2.tar.gz --clobber
          else
            gh release create "$tag" out/moonraker-wheels-k2.tar.gz \
              --title "Moonraker wheels for K2 (requirements ${{ needs.check.outputs.req_hash }})" \
              --notes "Prebuilt Python wheels for Moonraker's requirements as of ${commit} on the Creality K2 (Entware Python 3.11, linux_armv7l). Used by the helper's updatable Moonraker installer and by Moonraker updates (PIP_FIND_LINKS)." \
              --latest=false
          fi
